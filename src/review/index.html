<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtCoder 振り返り</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
  --accent: #2563eb; --accent-soft: #e0e9ff; --warn: #c2410c; --warn-soft: #ffedd5; --ok: #15803d;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --panel: #1a1e24; --text: #e5e7eb; --muted: #9ca3af; --line: #2c323b;
    --accent: #6ea0ff; --accent-soft: #1e2b47; --warn: #fb923c; --warn-soft: #3a2414; --ok: #4ade80; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.stats { color: var(--muted); font-size: 12px; display: flex; gap: 12px; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
input[type=search], select, textarea, input[type=text] {
  background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
input[type=search] { width: 200px; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
label.check { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }

main { display: grid; grid-template-columns: 210px 340px 1fr; height: calc(100vh - 55px); }
aside, #list, #detail { overflow-y: auto; }
aside { border-right: 1px solid var(--line); padding: 8px 0; background: var(--panel); }
.g { display: flex; align-items: center; gap: 8px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
.g:hover { background: var(--bg); }
.g.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.g .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.g .bar i { display: block; height: 100%; background: var(--accent); opacity: .6; }
.g .n { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 22px; text-align: right; }
.g .name { width: 104px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sep { height: 1px; background: var(--line); margin: 6px 0; }

#list { border-right: 1px solid var(--line); }
.item { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--panel); }
.item.sel { background: var(--accent-soft); }
.item .t { display: flex; gap: 6px; align-items: baseline; }
.item .t b { font-size: 14px; }
.item .t .flag { color: var(--warn); font-size: 12px; }
.item .memo { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.chip.none { background: var(--warn-soft); color: var(--warn); }
.empty { padding: 30px; color: var(--muted); text-align: center; }

#detail { padding: 16px 20px; }
#detail h2 { margin: 0 0 4px; font-size: 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#detail h2 a { font-size: 12px; font-weight: normal; color: var(--accent); }
.path { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.editor { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.editor h3 { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.pick { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.pick span { font-size: 12px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; user-select: none; }
.pick span.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.pick span.lock { background: var(--accent-soft); color: var(--accent); border-color: transparent; cursor: default; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.saved { color: var(--ok); font-size: 12px; }
.memo-view { white-space: pre-wrap; margin: 10px 0 0; }
.hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.back { display: none; margin-bottom: 10px; }
pre { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: auto; font-size: 13px; }
pre code.hljs, pre code { padding: 14px; display: block; font-family: Consolas, "JetBrains Mono", monospace; }

.tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; }
.tabs a { padding: 4px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
.tabs a.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
body.book-mode .solve-only { display: none; }
main[hidden] { display: none; }
.tb-link { display: inline-block; margin: 0 6px 10px 0; font-size: 12px; color: var(--accent); text-decoration: none; }

/* 教科書 */
main.book { grid-template-columns: 240px 1fr; }
#toc { padding: 8px 0; }
#toc .cat { font-size: 11px; color: var(--muted); font-weight: 600; padding: 10px 14px 4px; letter-spacing: .05em; }
#toc a { display: block; padding: 5px 14px; font-size: 13px; color: var(--text); text-decoration: none; }
#toc a:hover { background: var(--bg); }
#toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#doc { overflow-y: auto; padding: 20px 28px 60px; }
#doc .inner { max-width: 860px; }
#doc h1 { font-size: 24px; margin: 0 0 4px; }
#doc .lead { color: var(--muted); margin: 0 0 12px; }
#doc .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 18px; font-size: 12px; color: var(--muted); }
#doc h2 { font-size: 18px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
#doc h3 { font-size: 15px; margin: 20px 0 8px; }
#doc p, #doc li { line-height: 1.8; }
#doc a { color: var(--accent); }
#doc table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
#doc th, #doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
#doc th { background: var(--panel); }
#doc :not(pre) > code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12.5px;
  font-family: Consolas, "JetBrains Mono", monospace; }
#doc pre { margin: 10px 0; position: relative; }
#doc .copy { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 2px 8px; opacity: .8; }
#doc blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.mine { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
.mine a { margin-right: 8px; }

@media (max-width: 900px) {
  main.book { grid-template-columns: 1fr; }
  #toc { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  #toc .cat { width: 100%; padding: 6px 0 0; }
  #toc a { border: 1px solid var(--line); border-radius: 12px; padding: 3px 10px; font-size: 12px; }
  #doc { padding: 16px; }
  .tabs { order: -1; }
}
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  aside { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .g { padding: 3px 8px; border: 1px solid var(--line); border-radius: 12px; }
  .g .bar, .sep { display: none; }
  .g .name { width: auto; }
  #list { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #detail { padding: 16px; min-height: 100vh; }
  .back { display: inline-block; }
  header { position: static; padding: 10px 16px; }
  header h1 { width: 100%; }
  input[type=search] { flex: 1 1 100%; width: auto; }
  pre { font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <h1>AtCoder 振り返り</h1>
  <nav class="tabs">
    <a href="#" id="tabSolve">📝 解答</a>
    <a href="#textbook" id="tabBook">📘 教科書</a>
  </nav>
  <div class="solve-only stats" id="stats"></div>
  <div class="spacer"></div>
  <input class="solve-only" type="search" id="q" placeholder="検索 (abc451, メモ…)">
  <select class="solve-only" id="type"><option value="">全コンテスト</option><option>abc</option><option>arc</option><option>atc</option><option>betu</option></select>
  <select class="solve-only" id="prob"><option value="">全問題</option></select>
  <label class="solve-only check"><input type="checkbox" id="onlyReview"> 要復習のみ</label>
  <button class="solve-only" id="random" title="表示中のリストからランダムに1問">🎲 ランダム復習</button>
</header>
<main id="solveMain">
  <aside id="genres"></aside>
  <section id="list"></section>
  <section id="detail"><div class="empty">左のジャンルを選んで、問題をクリックしてください</div></section>
</main>
<main id="bookMain" class="book" hidden>
  <aside id="toc"></aside>
  <article id="doc"></article>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/kotlin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const UNCLASSIFIED = '__none__', ALL = '__all__';
const vocab = [
  '全探索', 'bit全探索', '順列全探索', '貪欲', '二分探索', '累積和', 'いもす法', '尺取り法', 'ソート',
  'DP', 'bitDP', '桁DP', '区間DP',
  'BFS', 'DFS', 'ダイクストラ', 'ワーシャルフロイド', 'Union-Find', '最小全域木', 'トポロジカルソート', '木', 'グラフ',
  '数学', '整数論', '組み合わせ', '幾何', '行列累乗',
  '文字列', 'シミュレーション', '実装', '二次元グリッド', '再帰',
  'スタック・キュー', '優先度付きキュー', 'セグメント木・BIT', '座標圧縮', '半分全列挙',
];
let items = [], editable = false, genre = ALL, selected = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const allGenres = it => [...new Set([...it.fileGenres, ...it.genres])];
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) {} return v; };

genre = store('genre') || ALL;

// PC で ReviewApp.kt から開いたときは /api/bundle (編集可)、GitHub Pages では bundle.json (閲覧のみ)
async function load() {
  let res = await fetch('/api/bundle').catch(() => null);
  if (!res || !res.ok) res = await fetch('bundle.json', { cache: 'no-cache' });
  const data = await res.json();
  editable = data.editable;
  items = buildItems(data).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

  const probs = [...new Set(items.map(it => it.problem))].sort((a, b) => a.length - b.length || a.localeCompare(b));
  $('prob').innerHTML = '<option value="">全問題</option>' + probs.map(p => `<option value="${esc(p)}">${esc(p)}問題</option>`).join('');
  ['type', 'prob'].forEach(id => $(id).value = store('f_' + id) || '');
  pages = Object.entries(data.textbook || {}).map(([file, md]) => parsePage(file, md))
    .sort((a, b) => a.order - b.order || a.title.localeCompare(b.title));
  render();
  route();
}

// ---------- 教科書 ----------
let pages = [];
const CATEGORIES = ['はじめに', 'データ構造', '数学', 'グラフ', '文字列'];

// 先頭の --- key: value --- を読む
function parsePage(file, md) {
  const m = md.replace(/\r\n/g, '\n').match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  const meta = {};
  (m ? m[1] : '').split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  return { slug: file.replace(/\.md$/, ''), title: meta.title || file, category: meta.category || 'その他',
    acl: meta.acl && meta.acl !== '-' ? meta.acl : '', summary: meta.summary || '', order: Number(meta.order) || 999,
    genres: splitGenres(meta.genres || ''), body: m ? m[2] : md };
}

const pagesForGenre = g => pages.filter(p => p.genres.includes(g));

function route() {
  const book = location.hash.startsWith('#textbook');
  document.body.classList.toggle('book-mode', book);
  $('solveMain').hidden = book;
  $('bookMain').hidden = !book;
  $('tabSolve').classList.toggle('on', !book);
  $('tabBook').classList.toggle('on', book);
  if (book) showPage(decodeURIComponent(location.hash.split('/')[1] || '') || pages[0]?.slug);
}

function showPage(slug) {
  const page = pages.find(p => p.slug === slug) || pages[0];
  const cats = [...CATEGORIES, ...new Set(pages.map(p => p.category))].filter((c, i, a) => a.indexOf(c) === i);
  $('toc').innerHTML = cats.map(c => {
    const ps = pages.filter(p => p.category === c);
    return ps.length ? `<div class="cat">${esc(c)}</div>` + ps.map(p =>
      `<a href="#textbook/${encodeURIComponent(p.slug)}" class="${p === page ? 'active' : ''}" title="${esc(p.summary)}">${esc(p.title)}</a>`).join('') : '';
  }).join('');
  if (!page) { $('doc').innerHTML = '<div class="empty">src/review/textbook/ にページがありません</div>'; return; }

  const mine = items.filter(it => allGenres(it).some(g => page.genres.includes(g)));
  const html = window.marked ? marked.parse(page.body) : `<pre>${esc(page.body)}</pre>`;
  $('doc').innerHTML = `<div class="inner">
    <h1>${esc(page.title)}</h1>
    ${page.summary ? `<p class="lead">${esc(page.summary)}</p>` : ''}
    <div class="meta">
      ${page.acl ? `<span>ACL: <code>${esc(page.acl)}</code></span>` : ''}
      ${page.genres.map(g => `<a class="chip" href="#" data-genre="${esc(g)}">${esc(g)}</a>`).join('')}
    </div>
    ${page.genres.length ? `<div class="mine">自分の解答 (${mine.length}件):
      ${mine.length ? mine.slice(0, 12).map(it => `<a href="#" data-open="${esc(it.path)}">${esc(it.contest)} ${esc(it.problem)}</a>`).join('')
        + (mine.length > 12 ? '…' : '') : '<span class="hint">まだありません。例題を解いてみよう！</span>'}</div>` : ''}
    ${html}</div>`;
  $('doc').scrollTop = 0;
  window.scrollTo(0, 0);

  $('doc').querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  $('doc').querySelectorAll('pre code').forEach(code => {
    if (window.hljs) hljs.highlightElement(code);
    const btn = document.createElement('button');
    btn.className = 'copy';
    btn.textContent = 'コピー';
    btn.onclick = () => navigator.clipboard?.writeText(code.textContent).then(() => btn.textContent = 'コピーしました');
    code.parentElement.appendChild(btn);
  });
  $('doc').querySelectorAll('[data-genre]').forEach(a => a.onclick = e => {
    e.preventDefault();
    genre = store('genre', a.dataset.genre);
    location.hash = '';
  });
  $('doc').querySelectorAll('[data-open]').forEach(a => a.onclick = e => {
    e.preventDefault();
    location.hash = '';
    open(a.dataset.open);
  });
}
window.addEventListener('hashchange', () => { route(); render(); });

const GENRE_LINE = /^\s*\/\/\s*genre\s*:(.*)$/i;
const splitGenres = s => s.split(/[,、]/).map(g => g.trim()).filter(Boolean);

function buildItems({ tsv, files }) {
  const entries = {};
  tsv.split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#')).forEach(l => {
    const [path, genres = '', review = '0', memo = ''] = l.split('\t');
    entries[path] = { genres: splitGenres(genres), review: review === '1',
      memo: memo.replace(/\\(.)/g, (_, c) => ({ n: '\n', t: '\t' }[c] ?? c)) };
  });
  return Object.entries(files).flatMap(([path, code]) => {
    const fileGenres = code.split(/\r?\n/).map(l => l.match(GENRE_LINE)).filter(Boolean).flatMap(m => splitGenres(m[1]));
    const entry = entries[path];
    if (!hasCode(code) && !fileGenres.length && !entry) return [];
    const [type, contest = '', name] = path.split('/');
    return [{ path, type, contest, problem: (name || contest).replace(/\.kt$/, '').toUpperCase(), code, fileGenres,
      genres: entry?.genres ?? [], review: entry?.review ?? false, memo: entry?.memo ?? '',
      lines: code.split('\n').filter(l => l.trim()).length }];
  });
}

// main の中身が空 (= Setup.kt で作っただけのテンプレート) でないか
function hasCode(code) {
  const m = /fun\s+main\s*\([^)]*\)\s*\{/.exec(code);
  if (!m) return false;
  let depth = 1, i = m.index + m[0].length;
  const start = i;
  for (; i < code.length && depth > 0; i++) depth += code[i] === '{' ? 1 : code[i] === '}' ? -1 : 0;
  return code.slice(start, i - 1).split('\n').some(l => l.trim() && !l.trim().startsWith('//'));
}
// abc007 → abc0007 のように番号を揃えて並べる
const sortKey = it => it.type + it.contest.replace(/\d+/, d => d.padStart(4, '0')) + it.problem;

function filtered() {
  const q = $('q').value.trim().toLowerCase(), type = $('type').value, prob = $('prob').value, onlyReview = $('onlyReview').checked;
  return items.filter(it => {
    const gs = allGenres(it);
    if (genre === UNCLASSIFIED ? gs.length : genre !== ALL && !gs.includes(genre)) return false;
    if (type && it.type !== type) return false;
    if (prob && it.problem !== prob) return false;
    if (onlyReview && !it.review) return false;
    if (q && !(it.path + ' ' + it.memo + ' ' + gs.join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const counts = {};
  items.forEach(it => allGenres(it).forEach(g => counts[g] = (counts[g] || 0) + 1));
  const none = items.filter(it => !allGenres(it).length).length;
  const max = Math.max(1, ...Object.values(counts));
  const extra = Object.keys(counts).filter(g => !vocab.includes(g)); // 自分で追加したジャンル
  const names = [...vocab, ...extra].filter(g => counts[g]).sort((a, b) => counts[b] - counts[a]);

  $('stats').innerHTML = `解いた <b>${items.length}</b> 未分類 <b>${none}</b> 要復習 <b>${items.filter(i => i.review).length}</b>`;
  const row = (key, label, n, bar) => `<div class="g ${genre === key ? 'active' : ''}" data-g="${esc(key)}">
      <span class="name">${esc(label)}</span>${bar ? `<span class="bar"><i style="width:${n / max * 100}%"></i></span>` : '<span class="spacer"></span>'}<span class="n">${n}</span></div>`;
  $('genres').innerHTML = row(ALL, 'すべて', items.length) + row(UNCLASSIFIED, '未分類', none) + '<div class="sep"></div>' +
    names.map(g => row(g, g, counts[g], true)).join('');
  document.querySelectorAll('.g').forEach(el => el.onclick = () => {
    genre = store('genre', el.dataset.g);
    render();
  });

  const list = filtered();
  $('list').innerHTML = list.length ? list.map(it => {
    const gs = allGenres(it);
    return `<div class="item ${selected === it.path ? 'sel' : ''}" data-p="${esc(it.path)}">
      <div class="t"><b>${esc(it.contest)} ${esc(it.problem)}</b>${it.review ? '<span class="flag">● 要復習</span>' : ''}</div>
      <div class="chips">${gs.length ? gs.map(g => `<span class="chip">${esc(g)}</span>`).join('') : '<span class="chip none">未分類</span>'}</div>
      ${it.memo ? `<div class="memo">${esc(it.memo)}</div>` : ''}</div>`;
  }).join('') : '<div class="empty">該当する問題がありません</div>';
  document.querySelectorAll('.item').forEach(el => el.onclick = () => open(el.dataset.p));
}

function open(path) {
  selected = path;
  const it = items.find(i => i.path === path);
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('sel', el.dataset.p === path));
  let picked = new Set(it.genres);
  const extra = [...new Set(items.flatMap(allGenres))].filter(g => !vocab.includes(g));
  const options = [...vocab, ...extra];
  const gs = allGenres(it);

  const viewer = `
    <div class="editor">
      <div class="chips">${gs.length ? gs.map(g => `<span class="chip">${esc(g)}</span>`).join('') : '<span class="chip none">未分類</span>'}
        ${it.review ? '<span class="chip none">● 要復習</span>' : ''}</div>
      ${it.memo ? `<p class="memo-view">${esc(it.memo)}</p>` : ''}
      <p class="hint">閲覧専用です。ジャンルやメモの編集は PC のアプリ、またはコードの // genre: 行で行い、push すると反映されます。</p>
    </div>`;
  $('detail').innerHTML = `
    <button class="back" id="back">↑ 一覧に戻る</button>
    <h2>${esc(it.contest)} ${esc(it.problem)}
      <a href="https://atcoder.jp/contests/${encodeURIComponent(it.contest)}/tasks" target="_blank" rel="noopener">AtCoderで問題を見る ↗</a></h2>
    <div class="path">src/${esc(it.path)} ・ ${it.lines}行</div>
    ${[...new Set(gs.flatMap(pagesForGenre))].map(p =>
      `<a class="tb-link" href="#textbook/${encodeURIComponent(p.slug)}">📘 ${esc(p.title)}</a>`).join('')}
    ${editable ? `<div class="editor">
      <h3>ジャンル（クリックで切替${it.fileGenres.length ? '・水色はソース内の // genre: 由来' : ''}）</h3>
      <div class="pick" id="pick"></div>
      <div class="row"><input type="text" id="newGenre" placeholder="新しいジャンルを追加"><button id="addGenre">追加</button></div>
      <h3 style="margin-top:12px">メモ（解法のポイント・ハマったところ）</h3>
      <textarea id="memo">${esc(it.memo)}</textarea>
      <div class="row">
        <label class="check"><input type="checkbox" id="review" ${it.review ? 'checked' : ''}> 要復習</label>
        <span class="spacer"></span><span class="saved" id="saved"></span>
        <button class="primary" id="save">保存 (Ctrl+S)</button>
      </div>
    </div>` : viewer}
    <pre><code class="language-kotlin" id="code"></code></pre>`;
  $('code').textContent = it.code;
  if (window.hljs) hljs.highlightElement($('code'));
  $('back').onclick = () => $('list').scrollIntoView({ behavior: 'smooth' });
  if (matchMedia('(max-width: 900px)').matches) $('detail').scrollIntoView({ behavior: 'smooth' });
  if (!editable) return;

  const drawPick = () => {
    $('pick').innerHTML = [...new Set([...options, ...picked])].map(g =>
      it.fileGenres.includes(g) ? `<span class="lock">${esc(g)}</span>`
        : `<span class="${picked.has(g) ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</span>`).join('');
    $('pick').querySelectorAll('span[data-g]').forEach(el => el.onclick = () => {
      picked.has(el.dataset.g) ? picked.delete(el.dataset.g) : picked.add(el.dataset.g);
      drawPick();
    });
  };
  drawPick();
  $('addGenre').onclick = () => {
    const g = $('newGenre').value.trim().replace(/[,\t]/g, '');
    if (g) { picked.add(g); $('newGenre').value = ''; drawPick(); }
  };
  $('newGenre').onkeydown = e => { if (e.key === 'Enter') $('addGenre').click(); };
  $('save').onclick = async () => {
    const body = new URLSearchParams({ path, genres: [...picked].join(','), review: $('review').checked ? '1' : '0', memo: $('memo').value });
    const res = await fetch('/api/save', { method: 'POST', body });
    if (!res.ok) { $('saved').textContent = '保存失敗: ' + await res.text(); return; }
    Object.assign(it, { genres: [...picked], review: $('review').checked, memo: $('memo').value });
    $('saved').textContent = '保存しました';
    render();
  };
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && $('save')) { e.preventDefault(); $('save').click(); }
});
['q', 'onlyReview'].forEach(id => $(id).addEventListener('input', render));
['type', 'prob'].forEach(id => $(id).addEventListener('input', () => { store('f_' + id, $(id).value); render(); }));
$('random').onclick = () => {
  const list = filtered();
  if (list.length) open(list[Math.floor(Math.random() * list.length)].path);
};
load().catch(e => $('list').innerHTML = `<div class="empty">読み込みに失敗しました: ${esc(String(e))}</div>`);
</script>
</body>
</html>
