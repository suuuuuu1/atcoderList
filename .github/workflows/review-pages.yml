# main に push するたびに、振り返りアプリ (src/review) を GitHub Pages に公開する。
# 初回だけ: GitHub のリポジトリ → Settings → Pages → Source を「GitHub Actions」にする。
name: review-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp src/review/index.html _site/
          python3 src/review/bundle.py > _site/bundle.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
